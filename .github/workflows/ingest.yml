name: Update headlines

on:
  schedule:
    # Hourly, off the top of the hour. Scheduled runs only fire on the default branch.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The hourly data lives on the `data` branch, which Vercel never builds.
      # Start from its last copy so the ingest merges into the previous wire,
      # then put back the files that are edited on main.
      - name: Load previous data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git checkout origin/data -- src/data
            git checkout HEAD -- src/data/editorial.json src/data/sources.json src/data/video-channels.json src/data/election.json src/data/flood-verified.json
          else
            echo "No data branch yet; starting from the copy on main."
          fi
      - run: npm test
      - run: npm run ingest
      # Police logs are PDFs; New Bedford's are scanned and need OCR. Install
      # the tools only when a new PDF is waiting. A failure here never blocks
      # the headline update.
      - name: Check for new police logs
        id: police
        continue-on-error: true
        run: node scripts/police-log.mjs --check
      - name: Install PDF and OCR tools
        if: steps.police.outputs.needs_tools == 'true'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Update police logs
        if: steps.police.outputs.needs_tools == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/police-log.mjs
      # Publish the data. The site reads these files from the `data` branch at
      # request time, so this never triggers a Vercel build. The branch keeps a
      # single commit (replaced each run) so the repository does not grow.
      # editorial.json, sources.json and the other hand-edited files are copied
      # too so the newsletter and social routines can read everything from one place.
      - name: Publish data
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/data-publish"
          mkdir -p "$RUNNER_TEMP/data-publish/src"
          cp -r src/data "$RUNNER_TEMP/data-publish/src/data"
          cd "$RUNNER_TEMP/data-publish"
          git init -q -b data
          git config user.name "bristol-brief-bot"
          git config user.email "bristol-brief-bot@users.noreply.github.com"
          git add src/data
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
