name: probe-listings
on:
  push:
    branches: [claude/bristol-county-news-site-bki3eq]
    paths: ['.github/workflows/probe-listings.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe listing sources
        shell: bash {0}
        run: |
          BR='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          probe() {
            code=$(curl -sL -m 30 -A "$BR" -o /tmp/p.out -w '%{http_code} %{size_download} %{content_type}' "$1")
            echo "[$?] $code  $1"
            head -c 160 /tmp/p.out | tr '\n\t' '  ' | cut -c1-120; echo
          }
          for u in https://www.taunton-ma.gov/ https://www.cityoftaunton.com/ https://www.attleboro.gov/ https://www.cityofattleboro.us/ https://www.cityofattleboro.org/ https://www.mass.gov/info-details/surplus-real-property https://www.mass.gov/lists/affordable-housing-lotteries https://www.masshousing.com/ https://www.zillow.com/attleboro-ma/ https://www.redfin.com/city/1779/MA/Attleboro https://www.realtor.com/realestateandhomes-search/Attleboro_MA https://www.homes.com/attleboro-ma/ https://providence.craigslist.org/search/rea?format=rss https://www.fnma.com/ https://www.hud.gov/; do probe "$u"; done
          echo "=== HUD search page ==="
          curl -sL -m 30 -A "$BR" -o /tmp/hud.html 'https://www.hudhomestore.gov/searchresult?citystate=MA'
          wc -c /tmp/hud.html
          grep -oiE '(api|ajax|fetch|\.json|PropertySearch|SearchResult|GetProperties)[A-Za-z0-9_/.?=&-]{0,80}' /tmp/hud.html | sort -u | head -40
          echo "--- bristol county towns present?"
          for t in "Fall River" "New Bedford" "Taunton" "Attleboro" "Dartmouth" "Seekonk" "Swansea" "Somerset"; do printf '%s: ' "$t"; grep -oc "$t" /tmp/hud.html; done
          echo "--- script/src refs"
          grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' /tmp/hud.html | head -20
          echo "--- title/headings"
          grep -oE '<title>[^<]*|<h[1-3][^>]*>[^<]{3,80}' /tmp/hud.html | head -15
