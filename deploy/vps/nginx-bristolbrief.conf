# /etc/nginx/sites-available/bristolbrief
# Every page is rendered by the Node server on :4322 from the current data on the
# `data` branch (src/lib/data-source.ts), so headline updates never need a
# build. nginx caches the rendered public pages for a few minutes, serves the
# build's static files (assets, images, favicon) straight from disk, and sends
# the admin and API routes to Node uncached.
# certbot --nginx adds the 443 server and the http->https redirect.

proxy_cache_path /var/cache/nginx/bristolbrief levels=1:2 keys_zone=bristolbrief:10m max_size=50m inactive=30m;

upstream bristolbrief_app {
    server 127.0.0.1:4322;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name bristolbrief.com www.bristolbrief.com;

    root /var/www/bristolbrief/.releases/current/client;
    index index.html;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Shared by every proxied location. Astro trusts these only for the hosts
    # in astro.config.mjs. X-Forwarded-For is overwritten, not appended, so a
    # visitor can't spoof their IP past the newsletter rate limit.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 15m;   # admin photo uploads

    # Hashed build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Taunton River gauge data: one upstream fetch per 5 minutes, like the
    # s-maxage Vercel's CDN honoured.
    location = /api/flood-data.json {
        proxy_cache bristolbrief;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://bristolbrief_app;
    }

    location /api/ { proxy_pass http://bristolbrief_app; }
    location /admin { proxy_pass http://bristolbrief_app; }

    # Static files from the build (favicon, social card, admin uploads) come
    # from disk; every other URL is a page. "/news" redirects to "/news/"
    # (trailingSlash: true).
    location / {
        try_files $uri @astro;
    }

    # Rendered pages, cached for 3 minutes. A stale copy is served while a fresh
    # one is fetched, and if Node is briefly down. Pages that set a cookie are
    # never cached.
    location @astro {
        proxy_cache bristolbrief;
        proxy_cache_valid 200 3m;
        proxy_cache_valid 301 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://bristolbrief_app;
    }
}
